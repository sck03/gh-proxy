name = "gh-proxy"
main = "index.js"
compatibility_date = "2023-10-02"

# 可直接修改 index.js 顶部的 DEFAULTS，以下环境变量都不是必填项。
# 同名环境变量会覆盖代码配置。普通使用无需配置 Token。
[vars]
# ASSET_URL = ""
# PREFIX = "/gh/"
# WHITE_LIST = ""
# UPSTREAM_TIMEOUT_MS = "30000"

# GH_TOKEN 使用 `npx wrangler secret put GH_TOKEN` 配置，不要提交到此文件。
