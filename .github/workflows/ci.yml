name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compatibility-date: ['2023-10-02', '2026-10-12']
    env:
      WORKER_COMPATIBILITY_DATE: ${{ matrix.compatibility-date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Install browser for page regression tests
        run: npx playwright-core install --with-deps chromium
      - run: npm run test:browser
      - name: Verify build preserves the editable source
        run: git diff --exit-code -- index.js
      - name: Validate Workers deployment bundle
        run: npx wrangler deploy --dry-run --outdir dist/wrangler
