name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify generated Worker is current
        run: git diff --exit-code -- index.js
      - name: Validate Workers deployment bundle
        run: npx wrangler deploy --dry-run --outdir dist/wrangler
